<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛФК «Факел» | Официальный сайт</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://vk.com/js/api/openapi.js?169" type="text/javascript"></script>
</head>
<body>

    <header id="top" data-aos="fade-down">
        <a href="index.html"><img src="img/logo.png" alt="Логотип ЛФК Факел" class="logo"></a>
        <h1 class="title">ЛФК <span>«Факел»</span></h1>
        <p class="subtitle">ОФИЦИАЛЬНЫЙ САЙТ</p>
    </header>

    <nav class="nav" data-aos="fade-in">
        <a href="index.html" title="На главную"><img src="img/logo.png" alt="Факел" class="nav-logo"></a>
        <div class="menu-btn" onclick="toggleMenu()">
            <span class="hamburger-icon">☰</span> МЕНЮ
        </div>
    </nav>

    <div class="sidebar-overlay" id="overlay" onclick="toggleMenu()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <ul class="sidebar-menu">
            <li style="text-align: center; margin-bottom: 20px;">
                <a href="index.html" style="display: inline-block; padding: 0; border: none;">
                    <img src="img/logo.png" style="width: 100px; border-radius: 12px; box-shadow: 0 0 15px rgba(0, 195, 255, 0.4);">
                </a>
            </li>
            <div class="sidebar-title">Клуб</div>
            <li><a href="about.html">О клубе</a></li>
            <li><a href="Веб 2.html">Команда</a></li>
            <div class="sidebar-title">Турнир</div>
            <li><a href="Веб 4.html">Матч-центр</a></li>
            <div class="sidebar-title">Медиа и Партнеры</div>
            <li><a href="#">Трансляции</a></li>
            <li><a href="#">Медиа</a></li>
            <li><a href="Веб 5.html">Партнерам</a></li>
        </ul>
    </aside>

    <div class="container">
        <div class="news-feed-section">
            <h2 class="section-title" data-aos="fade-right" style="justify-content: center; margin-bottom: 30px;">СВЕЖИЕ НОВОСТИ</h2>
            <div id="unified-feed">
                <!-- 3 свежих поста загрузятся сюда -->
            </div>
        </div>
    </div>

    <!-- Раздел для старых постов -->
    <div id="archive-section" style="display: none; max-width: 1000px; margin: 0 auto; padding: 0 10px;">
        <h2 class="archive-title">ПРЕДЫДУЩИЕ ЗАПИСИ</h2>
        <div class="archive-slider" id="archive-feed">
            <!-- Карусель старых постов загрузится сюда -->
        </div>
    </div>

    <footer>
        <p>Время зажечь Факел!</p>
        <p>© 2026, ЛФК «Факел» | Ростов-на-Дону</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 50 });
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.body.style.overflow = document.body.style.overflow === 'hidden' ? 'auto' : 'hidden';
        }

        let allPosts = [];
        const VK_GROUP_ID = '-227517599'; 
        const VK_TOKEN = 'ТВОЙ_СЕРВИСНЫЙ_КЛЮЧ_ВК'; // ВСТАВЬ КЛЮЧ СЮДА

        fetch('data/news.json')
            .then(res => res.json())
            .then(data => {
                if (data.posts) {
                    const cmsPosts = data.posts.map(p => ({
                        type: 'cms', title: p.title, body: p.body, image: p.image,
                        dateStr: p.date, timestamp: parseDate(p.date)
                    }));
                    allPosts.push(...cmsPosts);
                    renderFeed();
                }
            });

        const script = document.createElement('script');
        script.src = `https://api.vk.com/method/wall.get?owner_id=${VK_GROUP_ID}&count=15&access_token=${VK_TOKEN}&v=5.131&callback=processVKPosts`;
        document.body.appendChild(script);

        function processVKPosts(response) {
            if(response && response.response && response.response.items) {
                const vkPosts = response.response.items.map(p => {
                    let imgUrl = '';
                    if(p.attachments) {
                        const photoAtt = p.attachments.find(a => a.type === 'photo');
                        if(photoAtt) { imgUrl = photoAtt.photo.sizes[photoAtt.photo.sizes.length - 1].url; }
                    }
                    return {
                        type: 'vk', title: 'ВКонтакте', body: p.text, image: imgUrl,
                        dateStr: new Date(p.date * 1000).toLocaleDateString('ru-RU'),
                        timestamp: p.date * 1000, link: `https://vk.com/wall${VK_GROUP_ID}_${p.id}`
                    };
                });
                allPosts.push(...vkPosts);
                renderFeed();
            }
        }

        function parseDate(dateStr) {
            if(!dateStr) return 0;
            const parts = dateStr.split('.');
            if(parts.length === 3) return new Date(parts[2], parts[1]-1, parts[0]).getTime();
            return Date.now();
        }

        function renderFeed() {
            allPosts.sort((a, b) => b.timestamp - a.timestamp);
            
            const mainContainer = document.getElementById('unified-feed');
            const archiveContainer = document.getElementById('archive-feed');
            mainContainer.innerHTML = ''; archiveContainer.innerHTML = '';
            
            const topPosts = allPosts.slice(0, 3); // 3 поста на главную
            const olderPosts = allPosts.slice(3); // Остальные в архив
            
            topPosts.forEach(post => {
                const imgHtml = post.image ? `<img src="${post.image}" alt="">` : '';
                const titleStyle = post.type === 'vk' ? `style="color: #0077FF;"` : ``;
                const vkBtn = post.type === 'vk' ? `<br><a href="${post.link}" target="_blank" class="vk-link">Открыть в ВК →</a>` : '';
                const cleanBody = post.body.replace(/<[^>]*>?/gm, '');

                mainContainer.innerHTML += `
                    <article class="cms-news-card" data-aos="fade-up">
                        ${imgHtml}
                        <span class="cms-news-date">${post.dateStr}</span>
                        <h3 class="cms-news-title" ${titleStyle}>${post.title}</h3>
                        <p class="cms-news-text">${cleanBody}</p>${vkBtn}
                    </article>
                `;
            });

            if (olderPosts.length > 0) {
                document.getElementById('archive-section').style.display = 'block';
                olderPosts.forEach(post => {
                    const imgHtml = post.image ? `<img src="${post.image}" alt="">` : '';
                    const titleStyle = post.type === 'vk' ? `style="color: #0077FF;"` : ``;
                    const vkBtn = post.type === 'vk' ? `<a href="${post.link}" target="_blank" class="vk-link" style="margin-top:auto;">В ВК →</a>` : '';
                    const cleanBody = post.body.replace(/<[^>]*>?/gm, '');
                    
                    archiveContainer.innerHTML += `
                        <div class="archive-card">
                            ${imgHtml}
                            <span class="cms-news-date">${post.dateStr}</span>
                            <h3 class="cms-news-title" ${titleStyle}>${post.title}</h3>
                            <p class="cms-news-text">${cleanBody}</p>
                            ${vkBtn}
                        </div>
                    `;
                });
            }
        }
    </script>
</body>
</html>
