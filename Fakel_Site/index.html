<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛФК «Факел» | Официальный сайт</title>
    
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Подключение единого файла стилей с цветами клуба -->
    <link rel="stylesheet" href="style.css">

    <!-- Скрипт ВКонтакте -->
    <script src="https://vk.com/js/api/openapi.js?169" type="text/javascript"></script>

    <style>
        /* Сетка для главной страницы */
        .home-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            align-items: start;
        }
        .cms-news-card {
            background: var(--bg-panel);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 195, 255, 0.15);
            box-shadow: 0 10px 30px rgba(11, 29, 58, 0.05);
        }
        .cms-news-card img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            max-height: 400px;
            object-fit: cover;
        }
        .cms-news-date {
            color: var(--brand-light-blue);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
        }
        .cms-news-title {
            color: var(--brand-blue);
            font-size: 24px;
            margin: 0 0 15px 0;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }
        .vk-widget-container {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 195, 255, 0.15);
            box-shadow: 0 10px 30px rgba(11, 29, 58, 0.05);
            position: sticky;
            top: 100px;
        }
        @media (max-width: 900px) {
            .home-grid { grid-template-columns: 1fr; }
            .vk-widget-container { position: static; }
        }
    </style>
</head>
<body>

    <header id="top" data-aos="fade-down" data-aos-duration="1000">
        <img src="img/logo.png" alt="Логотип ЛФК Факел" class="logo">
        <h1 class="title">ЛФК <span>«Факел»</span></h1>
        <p class="subtitle">ОФИЦИАЛЬНЫЙ САЙТ</p>
    </header>

    <nav class="nav" data-aos="fade-in">
        <div class="menu-btn" onclick="toggleMenu()">
            <span class="hamburger-icon">☰</span> МЕНЮ
        </div>
    </nav>

    <div class="sidebar-overlay" id="overlay" onclick="toggleMenu()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <ul class="sidebar-menu">
            <li><a href="index.html" class="active">Главная</a></li>
            <div class="sidebar-title">Клуб</div>
            <li><a href="about.html">О клубе</a></li>
            <li><a href="Веб 2.html">Команда</a></li>
            <div class="sidebar-title">Турнир</div>
            <li><a href="Веб 4.html">Матч-центр</a></li>
            <div class="sidebar-title">Медиа и Партнеры</div>
            <li><a href="#">Трансляции</a></li>
            <li><a href="#">Медиа</a></li>
            <li><a href="Веб 5.html">Партнерам</a></li>
        </ul>
    </aside>

    <div class="container">
        
        <div class="home-grid">
            <!-- Левая колонка: Новости из админки -->
            <div class="news-feed-section">
                <h2 class="section-title" data-aos="fade-right">НОВОСТИ КЛУБА</h2>
                <div id="cms-news-container">
                    <!-- Посты загрузятся скриптом -->
                </div>
            </div>

            <!-- Правая колонка: Виджет ВКонтакте -->
            <div class="vk-section">
                <h2 class="section-title" data-aos="fade-left">ВКОНТАКТЕ</h2>
                <div class="vk-widget-container" id="vk_groups"></div>
            </div>
        </div>

    </div>

    <footer>
        <p>Время зажечь Факел!</p>
        <p>© 2026, ЛФК «Факел» | Ростов-на-Дону</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 100 });
        
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.body.style.overflow = document.body.style.overflow === 'hidden' ? 'auto' : 'hidden';
        }

        // Загрузка новостей из CMS (news.json)
        fetch('data/news.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('cms-news-container');
                // Переворачиваем массив, чтобы новые посты были сверху
                const posts = data.posts.reverse(); 
                
                posts.forEach(post => {
                    const imgHtml = post.image ? `<img src="${post.image}" alt="${post.title}">` : '';
                    container.innerHTML += `
                        <article class="cms-news-card" data-aos="fade-up">
                            ${imgHtml}
                            <span class="cms-news-date">${post.date}</span>
                            <h3 class="cms-news-title">${post.title}</h3>
                            <p style="color: var(--text-muted); font-weight: 500; white-space: pre-wrap;">${post.body}</p>
                        </article>
                    `;
                });
            })
            .catch(error => console.error('Ошибка загрузки новостей:', error));

        // Инициализация виджета ВК с ID твоей группы
        VK.Widgets.Group("vk_groups", {
            mode: 4, 
            wide: 1, 
            height: "800", 
            color1: "FFFFFF", 
            color2: "0B1D3A", 
            color3: "00C3FF"
        }, 227517599); 
    </script>
</body>
</html>
