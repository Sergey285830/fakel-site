<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛФК «Факел» | Главная</title>
    
    <link rel="icon" type="image/png" href="img/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Виджеты ВКонтакте -->
    <script type="text/javascript" src="https://vk.com/js/api/openapi.js?169"></script>

    <style>
        :root { 
            --bg-base: #030712; 
            --bg-panel: rgba(15, 23, 42, 0.75);
            --accent-blue: #2563eb; 
            --accent-gold: #f59e0b; 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
        }
        html { scroll-behavior: smooth; font-family: 'Montserrat', sans-serif; }
        body { 
            background-color: var(--bg-base); 
            /* Дорогие глубокие переливы синего и фоновые эмблемы */
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.22) 0%, transparent 45%), 
                radial-gradient(circle at 85% 85%, rgba(30, 58, 138, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #030712 100%),
                url('img/logo.png'), url('img/logo.png');
            background-repeat: no-repeat, no-repeat, no-repeat, repeat, repeat;
            background-position: 0 0, 0 0, 0 0, 5% 20%, 95% 80%;
            background-size: auto, auto, auto, 400px, 500px;
            /* Эффект водяных знаков */
            background-blend-mode: normal, normal, normal, overlay, overlay;
            background-attachment: fixed; 
            color: var(--text-main); 
            margin: 0; padding: 0; line-height: 1.6; 
        }
        
        /* Дополнительное мягкое затухание для фоновых водяных знаков */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.82);
            z-index: -1;
            pointer-events: none;
        }
        
        h1, h2, h3, .menu-btn, .sidebar-menu a {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        header { text-align: center; padding: 60px 20px 30px; position: relative; z-index: 2; }
        .logo { width: 220px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); margin-bottom: 20px; transition: transform 0.4s ease; border: 1px solid rgba(255,255,255,0.1); }
        .logo:hover { transform: scale(1.05); }
        
        .title { color: var(--text-main); font-size: 48px; margin: 0 0 10px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .title span { color: var(--accent-gold); }
        .subtitle { font-size: 18px; color: var(--text-muted); font-weight: 300; letter-spacing: 4px; margin: 0; }
        
        .nav { display: flex; align-items: center; padding: 20px 40px; background: rgba(3, 7, 18, 0.85); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .menu-btn { cursor: pointer; display: flex; align-items: center; gap: 12px; color: var(--text-main); font-size: 16px; letter-spacing: 2px; transition: color 0.3s; }
        .menu-btn:hover { color: var(--accent-gold); }
        .hamburger-icon { font-size: 24px; line-height: 1; }
        
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); z-index: 998; opacity: 0; visibility: hidden; transition: 0.4s; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar { position: fixed; top: 0; left: -400px; width: 350px; height: 100%; background: #0b1329; z-index: 999; box-shadow: 20px 0 50px rgba(0,0,0,0.9); transition: left 0.5s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto; padding: 50px 30px; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar.active { left: 0; }
        .close-btn { position: absolute; top: 25px; right: 30px; font-size: 40px; color: var(--text-muted); cursor: pointer; transition: 0.3s; font-family: sans-serif; font-weight: 300; }
        .close-btn:hover { color: var(--accent-gold); transform: rotate(90deg); }
        
        .sidebar-menu { list-style: none; padding: 0; margin: 40px 0 0 0; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu a { display: block; color: var(--text-main); text-decoration: none; font-size: 20px; padding: 15px 20px; transition: all 0.3s ease; border-left: 2px solid transparent; letter-spacing: 1px; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background: rgba(255, 255, 255, 0.04); border-left: 2px solid var(--accent-gold); color: var(--accent-gold); padding-left: 30px; }
        .sidebar-title { color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; margin: 30px 0 10px 20px; opacity: 0.5; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 60px 20px; position: relative; z-index: 2; }
        .section-title { font-size: 36px; color: var(--text-main); margin-bottom: 40px; display: flex; align-items: center; gap: 15px; }
        .section-title::before { content: ''; width: 40px; height: 4px; background: var(--accent-gold); display: block; }
        
        .vk-container { background: var(--bg-panel); padding: 30px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); display: flex; justify-content: center; overflow: hidden; }
        
        footer { text-align: center; padding: 50px 20px; color: var(--text-muted); background: #030712; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; position: relative; z-index: 2; }
        
        @media (max-width: 768px) {
            .title { font-size: 32px; }
            .sidebar { width: 300px; padding: 40px 20px; }
            .vk-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <header id="top" data-aos="fade-down" data-aos-duration="1000">
        <img src="img/logo.png" alt="Логотип ЛФК Факел" class="logo">
        <h1 class="title">ЛФК <span>«Факел»</span></h1>
        <p class="subtitle">ОФИЦИАЛЬНЫЙ САЙТ</p>
    </header>

    <nav class="nav" data-aos="fade-in" data-aos-delay="300">
        <div class="menu-btn" onclick="toggleMenu()">
            <span class="hamburger-icon">☰</span> МЕНЮ
        </div>
    </nav>

    <div class="sidebar-overlay" id="overlay" onclick="toggleMenu()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <ul class="sidebar-menu">
            <li><a href="index.html" class="active">Главная</a></li>
            <div class="sidebar-title">Клуб</div>
            <li><a href="about.html">О клубе</a></li>
            <li><a href="Веб 2.html">Команда</a></li>
            <div class="sidebar-title">Турнир</div>
            <li><a href="Веб 4.html">Матч-центр</a></li>
            <div class="sidebar-title">Медиа и Партнеры</div>
            <li><a href="#">Трансляции</a></li>
            <li><a href="#">Медиа</a></li>
            <li><a href="Веб 5.html">Партнерам</a></li>
        </ul>
    </aside>

    <div class="container">
        <h2 class="section-title" data-aos="fade-right">ЛЕНТА СООБЩЕСТВА</h2>
        
        <!-- Официальный виджет группы ВКонтакте -->
        <div class="vk-container" data-aos="fade-up" data-aos-delay="200">
            <div id="vk_groups" style="width: 100%;"></div>
        </div>
    </div>

    <footer>
        <p>Время зажечь Факел</p>
        <p>© 2026, ЛФК «Факел» | Ростов-на-Дону</p>
    </footer>

    <!-- Гарантированная инициализация виджета ВК -->
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof VK !== "undefined") {
                VK.Widgets.Group("vk_groups", {mode: 4, width: "auto", height: "550"}, "footballclubfakel161");
            }
        });
    </script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 100 });

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.body.style.overflow = document.body.style.overflow === 'hidden' ? 'auto' : 'hidden';
        }
    </script>

    <!-- Скрипт переадресации после логина (Netlify Identity) -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
</body>
</html>
